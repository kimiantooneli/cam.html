<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FindYourCam.</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { background-color: #f8fafc; color: #0f172a; min-height: 100vh; padding-bottom: 80px; }
        button { cursor: pointer; border: none; outline: none; font-family: inherit; transition: all 0.2s; }
        input, select, textarea { font-family: inherit; outline: none; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px 16px; font-size: 14px; background: #ffffff; }

        /* HEADER */
        header { background: #ffffff; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 90; }
        .brand { font-size: 22px; font-weight: 800; color: #0f172a; letter-spacing: -0.5px; }
        .header-icon { font-size: 20px; }

        .container { max-width: 480px; margin: 0 auto; padding: 0 16px; }

        /* BANNER */
        .hero-banner { background: #0f172a; color: white; border-radius: 20px; padding: 24px 20px; margin-top: 8px; margin-bottom: 20px; }
        .hero-banner h1 { font-size: 22px; font-weight: 800; line-height: 1.2; margin-bottom: 8px; }
        .hero-banner p { font-size: 13px; color: #94a3b8; }

        /* SEARCH & FILTERS */
        .search-box { position: relative; margin-bottom: 16px; }
        .search-box input { width: 100%; padding-left: 44px; border-radius: 25px; border: 1px solid #e2e8f0; font-size: 13px; background: #fff; }
        .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-size: 14px; opacity: 0.5; }

        .filter-pills { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 20px; scrollbar-width: none; }
        .filter-pills::-webkit-scrollbar { display: none; }
        .pill { padding: 8px 18px; border-radius: 20px; font-size: 12px; font-weight: 600; white-space: nowrap; background: #ffffff; color: #475569; border: 1px solid #e2e8f0; }
        .pill.active { background: #0f172a; color: #ffffff; border-color: #0f172a; }

        /* PRODUCT GRID (HOME) */
        .grid-products { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .card-product { background: #ffffff; border-radius: 16px; padding: 12px; position: relative; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid #f1f5f9; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
        .badge-discount { position: absolute; top: 18px; left: 18px; background: #ef4444; color: white; font-size: 10px; font-weight: 800; padding: 4px 8px; border-radius: 6px; z-index: 2; }
        .product-img { width: 100%; height: 140px; object-fit: contain; border-radius: 12px; margin-bottom: 10px; background: #fff; }
        .product-name { font-size: 13px; font-weight: 700; color: #0f172a; margin-bottom: 4px; line-height: 1.3; }
        .price-box { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
        .price-main { font-size: 14px; font-weight: 800; color: #0f172a; }
        .price-old { font-size: 11px; color: #94a3b8; text-decoration: line-through; }
        .rating-box { font-size: 11px; font-weight: 700; color: #f59e0b; margin-bottom: 10px; }
        .btn-buy-now { width: 100%; padding: 8px; background: #f1f5f9; color: #0f172a; font-weight: 700; font-size: 11px; border-radius: 8px; display: flex; align-items: center; justify-content: center; gap: 4px; }

        /* DETAIL VIEW */
        .detail-title { font-size: 20px; font-weight: 800; margin-top: 10px; margin-bottom: 4px; }
        .detail-desc { font-size: 13px; color: #64748b; line-height: 1.5; margin-bottom: 20px; }
        .action-buttons { display: flex; gap: 10px; margin-bottom: 24px; }
        .btn-outline { flex: 1; padding: 12px; border: 1px solid #0f172a; background: transparent; color: #0f172a; font-weight: 700; font-size: 12px; border-radius: 10px; }
        .btn-solid { flex: 1; padding: 12px; background: #0f172a; color: white; font-weight: 700; font-size: 12px; border-radius: 10px; display: flex; align-items: center; justify-content: center; gap: 6px; }

        /* REVIEWS IN DETAIL */
        .section-title { font-size: 16px; font-weight: 800; margin-bottom: 14px; }
        .review-card { background: #ffffff; padding: 14px; border-radius: 12px; margin-bottom: 10px; border: 1px solid #f1f5f9; }
        .review-header { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
        .review-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }
        .review-username { font-size: 13px; font-weight: 700; }
        .stars { color: #f59e0b; font-size: 10px; }
        .review-text { font-size: 12px; color: #475569; line-height: 1.4; }

        /* ADMIN DASHBOARD */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px; }
        .stat-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px 8px; text-align: center; }
        .stat-num { font-size: 18px; font-weight: 800; color: #0f172a; }
        .stat-label { font-size: 10px; color: #64748b; margin-top: 2px; }

        .admin-box { background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 16px; margin-bottom: 20px; }
        .form-row { display: flex; gap: 10px; margin-bottom: 12px; }
        .btn-admin-submit { width: 100%; padding: 12px; background: #0f172a; color: white; font-weight: 700; border-radius: 10px; font-size: 13px; }

        .table-inventory { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 10px; }
        .table-inventory th { text-align: left; color: #64748b; padding-bottom: 8px; font-weight: 600; }
        .table-inventory td { padding: 10px 0; border-top: 1px solid #f1f5f9; }
        .btn-text-delete { color: #ef4444; font-weight: 700; font-size: 12px; background: none; }

        /* BOTTOM NAVBAR */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #ffffff; border-top: 1px solid #e2e8f0; display: flex; justify-content: space-around; padding: 10px 0; z-index: 100; max-width: 480px; margin: 0 auto; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; color: #64748b; cursor: pointer; position: relative; text-decoration: none; }
        .nav-item.active { color: #0284c7; font-weight: 700; }
        .nav-icon { font-size: 18px; }
        .cart-badge { position: absolute; top: -2px; right: 8px; background: #ef4444; color: white; font-size: 9px; font-weight: 800; border-radius: 10px; padding: 1px 5px; }

        /* AUTH MODAL */
        .auth-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.4); backdrop-filter: blur(4px); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-card { background: #fff; width: 100%; max-width: 360px; border-radius: 20px; padding: 24px; }
    </style>
</head>
<body>

    <header>
        <div class="brand">FindYourCam.</div>
        <div class="header-icon">📸</div>
    </header>

    <div class="container">
        <!-- VIEW: HOME CATALOG -->
        <div id="view-home">
            <div class="hero-banner">
                <h1>Welcome, happy shopping, Camers! 📸</h1>
                <p>Find your aesthetic vintage digicam below.</p>
            </div>

            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="search-input" placeholder="Search digicam brand..." onkeyup="filterProducts()">
            </div>

            <div class="filter-pills">
                <button class="pill active" onclick="setCategory('all', this)">Home</button>
                <button class="pill" onclick="setCategory('discount', this)">Digicam Discount</button>
                <button class="pill" onclick="setCategory('ready', this)">Cams ready to buy</button>
            </div>

            <div class="grid-products" id="product-grid"></div>
        </div>

        <!-- VIEW: PRODUCT DETAIL & REVIEWS -->
        <div id="view-detail" style="display: none;">
            <button onclick="navTo('home')" style="background:none; font-size:12px; font-weight:700; color:#64748b; margin-bottom:10px;">← Back to Catalog</button>
            <div id="detail-content"></div>
        </div>

        <!-- VIEW: CART & ORDERS -->
        <div id="view-cart" style="display: none;">
            <div class="section-title" style="margin-top:10px;">My Cart & Orders 📦</div>
            <div id="cart-orders-list"></div>
        </div>

        <!-- VIEW: ADMIN DASHBOARD -->
        <div id="view-admin" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px; margin-bottom: 16px;">
                <h2 style="font-size: 18px; font-weight: 800;">Admin Dashboard</h2>
                <button onclick="logoutAdmin()" style="color: #ef4444; font-size: 12px; font-weight: 700; background: none;">Log Out</button>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-num" id="stat-items">0</div>
                    <div class="stat-label">Total Items</div>
                </div>
                <div class="stat-card">
                    <div class="stat-num" id="stat-stock">0</div>
                    <div class="stat-label">Total Stock</div>
                </div>
                <div class="stat-card">
                    <div class="stat-num" id="stat-orders">0</div>
                    <div class="stat-label">Total Orders</div>
                </div>
            </div>

            <div class="admin-box">
                <h3 style="font-size: 14px; font-weight: 800; margin-bottom: 12px;">Add New Digicam</h3>
                <form onsubmit="handleAdminAdd(event)">
                    <input type="text" id="adm-pname" placeholder="Camera Name" style="width: 100%; margin-bottom: 10px;" required>
                    <div class="form-row">
                        <input type="number" id="adm-pprice" placeholder="Price ($)" style="flex: 1;" required>
                        <input type="number" id="adm-pstock" placeholder="Stock" style="flex: 1;" required>
                    </div>
                    <input type="text" id="adm-pdesc" placeholder="Description (e.g. CCD Sensor...)" style="width: 100%; margin-bottom: 12px;" required>
                    <button type="submit" class="btn-admin-submit">+ Add Product</button>
                </form>
            </div>

            <div class="admin-box">
                <h3 style="font-size: 14px; font-weight: 800; margin-bottom: 12px;">Product Inventory</h3>
                <table class="table-inventory">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Price</th>
                            <th style="text-align: right;">Action</th>
                        </tr>
                    </thead>
                    <tbody id="admin-inventory-tbody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- BOTTOM NAVBAR -->
    <div class="bottom-nav">
        <div class="nav-item active" id="nav-home" onclick="navTo('home')">
            <span class="nav-icon">🏠</span>
            <span>Home</span>
        </div>
        <div class="nav-item" id="nav-cart" onclick="navTo('cart')">
            <span class="nav-icon">🛒</span>
            <span>Cart</span>
            <span class="cart-badge" id="cart-count">0</span>
        </div>
        <div class="nav-item" id="nav-account" onclick="openAdminAuth()">
            <span class="nav-icon">👤</span>
            <span>Account</span>
        </div>
    </div>

    <!-- ADMIN LOGIN MODAL -->
    <div class="auth-overlay" id="auth-modal" style="display: none;">
        <div class="auth-card">
            <h3 style="font-size: 16px; font-weight: 800; margin-bottom: 12px;">Admin Login</h3>
            <form onsubmit="loginAdmin(event)">
                <input type="text" id="admin-pass" placeholder="Enter admin password ('admin')" style="width:100%; margin-bottom:12px;" required>
                <div style="display:flex; gap:8px;">
                    <button type="button" onclick="document.getElementById('auth-modal').style.display='none'" style="flex:1; padding:10px; background:#f1f5f9; border-radius:8px; font-weight:700; font-size:12px;">Cancel</button>
                    <button type="submit" style="flex:1; padding:10px; background:#0f172a; color:#fff; border-radius:8px; font-weight:700; font-size:12px;">Login</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const initialProducts = [
            {
                id: 1,
                name: "Canon IXY Digital 930 IS",
                price: 185,
                oldPrice: 220,
                discount: "15% OFF",
                rating: "4.9",
                category: "ready",
                stock: 8,
                img: "digicam1.jpg",
                desc: "Classic compact digicam with rich color science. Perfect for vintage aesthetic film-like photography.",
                reviews: [
                    {
                        username: "cherries",
                        avatar: "cherries.jpg",
                        text: "such a beautiful cam... aaa I didn't expect the digicam output to be this good! retro vibe totally nailed! ✨"
                    },
                    {
                        username: "Arven Thoories",
                        avatar: "Arven.jpg",
                        text: "I think all the Digicams here are great. High technical fidelity and crisp output for a vintage model. Much obliged."
                    },
                    {
                        username: "cacichu",
                        avatar: "cacichu.jpg",
                        text: "OMG it's super cute!! The body design is so tiny and aesthetic, fits right in my mini bag! <3"
                    }
                ]
            },
            {
                id: 2,
                name: "Sony Cyber-shot DSC-W350",
                price: 140,
                oldPrice: 175,
                discount: "20% OFF",
                rating: "4.8",
                category: "discount",
                stock: 5,
                img: "digicam2.jpg",
                desc: "Ultra-slim CCD sensor digicam known for soft skin tones and iconic early 2000s flash photo aesthetics.",
                reviews: [
                    {
                        username: "Anderson.",
                        avatar: "anderson.jpg",
                        text: "Clean sharpness, surprisingly deep color rendering. A solid addition to my kit."
                    },
                    {
                        username: "Isaiah Journey",
                        avatar: "isaiah.jpg",
                        text: "The night flash pictures look so moody and cool!! Love it sm, much gracias!"
                    },
                    {
                        username: "George Soujhr",
                        avatar: "george.jpg",
                        text: "I bought this cams for my girlfriend, didn't expect she's so like it. Fast delivery, camera arrived in pristine mint condition. Operates smoothly, thankyou FindYourCam."
                    }
                ]
            },
            {
                id: 3,
                name: "Fujifilm FinePix Z33WP Pink",
                price: 165,
                oldPrice: 190,
                discount: "12% OFF",
                rating: "5.0",
                category: "promo",
                stock: 3,
                img: "digicam3.jpg",
                desc: "Vibrant pink waterproof digicam. Extremely rare aesthetic body with punchy contrast tones.",
                reviews: [
                    {
                        username: "maureen vseih",
                        avatar: "maureen.jpg",
                        text: "PINK PINK PINK! Absolute perfection! I'm screaming because of how adorable this camera is!"
                    },
                    {
                        username: "belleyourfavorite",
                        avatar: "belle.jpg",
                        text: "The tone is naturally warm and dreamy! No editing needed at all!"
                    },
                    {
                        username: "Parker",
                        avatar: "zeon.jpg",
                        text: "Surprisingly rugged build despite the bright aesthetic color scheme. Excellent shutter response."
                    }
                ]
            },
            {
                id: 4,
                name: "Nikon Coolpix S210",
                price: 130,
                oldPrice: 150,
                discount: "10% OFF",
                rating: "4.7",
                category: "ready",
                stock: 10,
                img: "digicam4.jpg",
                desc: "Sleek metallic finish digicam with quick focus and nostalgic low-light noise grain.",
                reviews: [
                    {
                        username: "Soren",
                        avatar: "soren.jpg",
                        text: "Reliable ergonomics. Compact enough for daily pocket carry without sacrificing optical clarity."
                    },
                    {
                        username: "Velix 4sho",
                        avatar: "velix.jpg",
                        text: "Great vintage look. Really good value for money."
                    },
                    {
                        username: "mills",
                        avatar: "cami.jpg",
                        text: "Gives that iconic Y2K celebrity photo look! obsessed!"
                    }
                ]
            },
            {
                id: 5,
                name: "Olympus Camedia FE-230",
                price: 110,
                oldPrice: 140,
                discount: "25% OFF",
                rating: "4.6",
                category: "discount",
                stock: 4,
                img: "digicam5.jpg",
                desc: "Lightweight vintage CCD camera with crisp lens for warm outdoor portrait shots.",
                reviews: [
                    {
                        username: "zeell",
                        avatar: "zella.jpg",
                        text: "Took this to concert and results were immaculate! 1000/10!"
                    },
                    {
                        username: "KAAALILAAAA",
                        avatar: "kalila.jpg",
                        text: "Solid construction, dynamic range is remarkable for its era."
                    },
                    {
                        username: "kimi22",
                        avatar: "kimi.jpg",
                        text: "Super cute and easy to use! Buttons are smooth!"
                    }
                ]
            }
        ];

        let products = JSON.parse(localStorage.getItem('my_cam_products')) || initialProducts;
        let cart = JSON.parse(localStorage.getItem('my_cam_cart')) || [];
        let currentCategory = 'all';
        let isAdminLoggedIn = false;

        function saveData() {
            localStorage.setItem('my_cam_products', JSON.stringify(products));
            localStorage.setItem('my_cam_cart', JSON.stringify(cart));
            updateCartBadge();
        }

        function updateCartBadge() {
            document.getElementById('cart-count').innerText = cart.length;
        }

        /* NAVIGATION */
        function navTo(viewName) {
            document.getElementById('view-home').style.display = 'none';
            document.getElementById('view-detail').style.display = 'none';
            document.getElementById('view-cart').style.display = 'none';
            document.getElementById('view-admin').style.display = 'none';

            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

            if (viewName === 'home') {
                document.getElementById('view-home').style.display = 'block';
                document.getElementById('nav-home').classList.add('active');
                renderProducts();
            } else if (viewName === 'cart') {
                document.getElementById('view-cart').style.display = 'block';
                document.getElementById('nav-cart').classList.add('active');
                renderCart();
            } else if (viewName === 'admin') {
                document.getElementById('view-admin').style.display = 'block';
                document.getElementById('nav-account').classList.add('active');
                renderAdmin();
            }
        }

        /* HOME CATALOG RENDER */
        function renderProducts() {
            const grid = document.getElementById('product-grid');
            const searchVal = document.getElementById('search-input').value.toLowerCase();

            const filtered = products.filter(p => {
                const matchesCategory = currentCategory === 'all' || p.category === currentCategory;
                const matchesSearch = p.name.toLowerCase().includes(searchVal);
                return matchesCategory && matchesSearch;
            });

            grid.innerHTML = filtered.map(p => `
                <div class="card-product" onclick="openDetail(${p.id})">
                    ${p.discount ? `<span class="badge-discount">${p.discount}</span>` : ''}
                    <img src="${p.img}" class="product-img" onerror="this.src='https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=500'">
                    <div>
                        <div class="product-name">${p.name}</div>
                        <div class="price-box">
                            <span class="price-main">$${p.price}</span>
                            ${p.oldPrice ? `<span class="price-old">$${p.oldPrice}</span>` : ''}
                        </div>
                        <div class="rating-box">★ ${p.rating}</div>
                    </div>
                    <button class="btn-buy-now" onclick="event.stopPropagation(); addToCart(${p.id})">
                        🛒 Buy Now
                    </button>
                </div>
            `).join('');
        }

        function setCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.pill').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderProducts();
        }

        function filterProducts() {
            renderProducts();
        }

        /* PRODUCT DETAIL & REVIEWS */
        function openDetail(pId) {
            const p = products.find(x => x.id === pId);
            const container = document.getElementById('detail-content');

            document.getElementById('view-home').style.display = 'none';
            document.getElementById('view-detail').style.display = 'block';

            container.innerHTML = `
                <div class="detail-title">${p.name}</div>
                <div class="price-box" style="margin-bottom:12px;">
                    <span class="price-main" style="font-size:18px;">$${p.price}</span>
                    ${p.oldPrice ? `<span class="price-old" style="font-size:13px;">$${p.oldPrice}</span>` : ''}
                </div>
                <div class="detail-desc">${p.desc}</div>

                <div class="action-buttons">
                    <button class="btn-outline" onclick="addToCart(${p.id})">+ Add To Cart</button>
                    <button class="btn-solid" onclick="buyNowDirect(${p.id})">🛒 Buy Now</button>
                </div>

                <div class="section-title">Customer Reviews</div>
                <div>
                    ${p.reviews && p.reviews.length > 0 ? p.reviews.map(r => `
                        <div class="review-card">
                            <div class="review-header">
                                <img src="${r.avatar}" class="review-avatar" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(r.username)}'">
                                <div>
                                    <div class="review-username">${r.username}</div>
                                    <div class="stars">★★★★★</div>
                                </div>
                            </div>
                            <div class="review-text">${r.text}</div>
                        </div>
                    `).join('') : '<p style="font-size:12px; color:#64748b;">No reviews yet.</p>'}
                </div>
            `;
        }

        /* CART & CHECKOUT */
        function addToCart(pId) {
            const p = products.find(x => x.id === pId);
            cart.push(p);
            saveData();
            alert(`Added "${p.name}" to cart!`);
        }

        function buyNowDirect(pId) {
            addToCart(pId);
            navTo('cart');
        }

        function renderCart() {
            const container = document.getElementById('cart-orders-list');
            if (cart.length === 0) {
                container.innerHTML = `<p style="font-size:13px; color:#64748b; text-align:center; padding:40px 0;">Your cart is empty.</p>`;
                return;
            }

            const total = cart.reduce((sum, item) => sum + item.price, 0);

            container.innerHTML = `
                ${cart.map((item, idx) => `
                    <div style="background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:12px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;">
                        <div>
                            <div style="font-size:13px; font-weight:700;">${item.name}</div>
                            <div style="font-size:13px; font-weight:800; color:#0f172a;">$${item.price}</div>
                        </div>
                        <button onclick="removeFromCart(${idx})" style="color:#ef4444; font-size:11px; font-weight:700; background:none;">Remove</button>
                    </div>
                `).join('')}
                <div style="margin-top:20px; background:#fff; border-radius:12px; padding:16px; border:1px solid #e2e8f0;">
                    <div style="display:flex; justify-content:space-between; font-weight:800; font-size:15px; margin-bottom:12px;">
                        <span>Total:</span>
                        <span>$${total}</span>
                    </div>
                    <button onclick="checkoutCart()" style="width:100%; padding:12px; background:#0f172a; color:white; font-weight:700; border-radius:10px;">Checkout Order</button>
                </div>
            `;
        }

        function removeFromCart(idx) {
            cart.splice(idx, 1);
            saveData();
            renderCart();
        }

        function checkoutCart() {
            alert('Order placed successfully! Thank you for shopping with FindYourCam.');
            cart = [];
            saveData();
            renderCart();
        }

        /* ADMIN */
        function openAdminAuth() {
            if (isAdminLoggedIn) {
                navTo('admin');
            } else {
                document.getElementById('auth-modal').style.display = 'flex';
            }
        }

        function loginAdmin(e) {
            e.preventDefault();
            const pass = document.getElementById('admin-pass').value;
            if (pass === 'admin' || pass === '123') {
                isAdminLoggedIn = true;
                document.getElementById('auth-modal').style.display = 'none';
                navTo('admin');
            } else {
                alert('Wrong password! Use: admin');
            }
        }

        function logoutAdmin() {
            isAdminLoggedIn = false;
            navTo('home');
        }

        function renderAdmin() {
            // Stats
            document.getElementById('stat-items').innerText = products.length;
            const totalStock = products.reduce((sum, p) => sum + Number(p.stock || 0), 0);
            document.getElementById('stat-stock').innerText = totalStock;
            document.getElementById('stat-orders').innerText = "0";

            // Table
            const tbody = document.getElementById('admin-inventory-tbody');
            tbody.innerHTML = products.map((p, idx) => `
                <tr>
                    <td>#${idx + 1}</td>
                    <td style="font-weight:600;">${p.name}</td>
                    <td>$${p.price}</td>
                    <td style="text-align: right;">
                        <button class="btn-text-delete" onclick="deleteAdminProduct(${p.id})">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        function handleAdminAdd(e) {
            e.preventDefault();
            const newP = {
                id: Date.now(),
                name: document.getElementById('adm-pname').value,
                price: Number(document.getElementById('adm-pprice').value),
                stock: Number(document.getElementById('adm-pstock').value),
                desc: document.getElementById('adm-pdesc').value,
                rating: 5.0,
                category: "ready",
                img: "https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=500",
                reviews: []
            };
            products.unshift(newP);
            saveData();
            renderAdmin();
            e.target.reset();
            alert('New digicam added to inventory!');
        }

        function deleteAdminProduct(pId) {
            if (confirm('Delete this product from store?')) {
                products = products.filter(p => p.id !== pId);
                saveData();
                renderAdmin();
            }
        }

        // Init
        saveData();
        renderProducts();
    </script>
</body>
</html>
